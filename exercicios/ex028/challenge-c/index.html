<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>grid-challenge</title>
</head>
<body>
    <div class="container">
            <header class="box" id="top">
                <h1>Top </h1>

            </header>

            <nav class="box" id="menu">
                <h1>Menu</h1>
            </nav>

            <main class="box" id="primary">
                <h1>Main</h1>
            </main>

            <aside class="box" id="secondary">
                <h1>Secondary</h1>
            </aside>

            <footer class="box" id="bottom">
                <h1>Bottom</h1>
            </footer>
        </div>
    </body>
</html>
